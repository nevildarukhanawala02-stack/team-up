<!doctype html>
<!-- Team Up Civic Editorial prototype: paper, ink, gold, and documentary warmth. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#F0E6D2" />

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-90LX10472G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      // No initial gtag('config', ...) page_view here on purpose: this is a
      // single-page app, so every page view, including the first, is fired
      // from RouteTracker.tsx as routes change client-side. Sending one
      // here too would double-count the first page load.
      gtag('config', 'G-90LX10472G', { send_page_view: false });
    </script>

    <meta name="description" content="Team Up turns CSR employee activities into moments people remember. Celebration, not charity." />
    <title>Team Up — Celebration, not charity.</title>
    <link rel="icon" href="/images/teamup-foundation-logo-transparent-local.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
